name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: typecheck · lint · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Codegen drift
        run: npm run codegen && git diff --exit-code -- src/commands/resources

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
